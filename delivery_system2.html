<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auswah - متجر المنتجات الرقمية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6C5CE7;
            --secondary: #A29BFE;
            --dark: #2D3436;
            --light: #F8F9FA;
            --accent: #FF6B6B;
            --success: #00B894;
            --card-bg: #ffffff;
            --shadow: 0 20px 60px rgba(0,0,0,0.1);
            --shadow-hover: 0 30px 80px rgba(108, 92, 231, 0.3);
            --radius: 24px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Cairo', sans-serif;
            background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 30%, #fce7f3 70%, #fef2f2 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Glassmorphism Navbar */
        .navbar {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.8);
            padding: 1rem 2rem;
            position: sticky;
            top: 1rem;
            z-index: 1000;
            border-radius: 100px;
            margin: 1rem auto;
            max-width: 1200px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .navbar.scrolled {
            box-shadow: 0 20px 60px rgba(108, 92, 231, 0.15);
            background: rgba(255,255,255,0.85);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: var(--dark);
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--primary), #a78bfa);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.3);
            transition: transform 0.3s ease;
        }

        .logo:hover .logo-icon {
            transform: rotate(-10deg) scale(1.1);
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            background: var(--light);
            padding: 0.8rem;
            border-radius: 50%;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .cart-icon:hover {
            background: var(--primary);
            transform: scale(1.1);
            border-color: var(--primary);
        }

        .cart-icon:hover .icon {
            filter: brightness(0) invert(1);
        }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--accent);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 107, 107, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); }
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 4rem 2rem;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(108,92,231,0.08) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(108, 92, 231, 0.1);
            color: var(--primary);
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(108, 92, 231, 0.2);
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--dark) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }

        .hero p {
            font-size: 1.2rem;
            color: #636e72;
            max-width: 600px;
            margin: 0 auto 2rem;
        }

        .cta-btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), #a78bfa);
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(108, 92, 231, 0.3);
            border: none;
            cursor: pointer;
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 60px rgba(108, 92, 231, 0.5);
        }

        /* Products Grid */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .section-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 2.5rem;
            text-align: center;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background: var(--primary);
            margin: 1rem auto;
            border-radius: 2px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.5);
            position: relative;
            overflow: hidden;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), #f472b6);
            transform: scaleX(0);
            transition: transform 0.4s ease;
        }

        .product-card:hover::before {
            transform: scaleX(1);
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-hover);
        }

        .product-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--accent);
            color: white;
            padding: 0.3rem 1rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            z-index: 1;
        }

        .product-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #f5f3ff, #ede9fe);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.05);
        }

        .product-category {
            color: var(--primary);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .product-name {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .product-rating {
            color: #fbbf24;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-price {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--dark);
        }

        .product-price span {
            font-size: 0.9rem;
            color: #636e72;
            font-weight: 400;
        }

        .add-to-cart-btn {
            background: var(--dark);
            color: white;
            border: none;
            padding: 0.7rem 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .add-to-cart-btn:hover {
            background: var(--primary);
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.4);
            transform: scale(1.05);
        }

        .add-to-cart-btn .cart-icon-small {
            font-size: 1.2rem;
        }

        /* Cart Modal */
        .cart-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .cart-modal.active {
            display: flex;
        }

        .cart-content {
            background: white;
            border-radius: var(--radius);
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 50px 100px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .cart-close {
            background: var(--light);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .cart-close:hover {
            background: var(--accent);
            color: white;
            transform: rotate(90deg);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid #eee;
            transition: all 0.3s ease;
        }

        .cart-item:hover {
            background: var(--light);
            border-radius: 12px;
        }

        .remove-btn {
            background: transparent;
            color: var(--accent);
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .remove-btn:hover {
            transform: scale(1.1);
        }

        .cart-total {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 1.5rem 0;
            text-align: right;
        }

        .checkout-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--success), #55efc4);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 184, 148, 0.3);
        }

        .checkout-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 50px rgba(0, 184, 148, 0.5);
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--dark);
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            transform: translateX(200%);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 3000;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .toast.show {
            transform: translateX(0);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }
            .navbar {
                border-radius: 50px;
                padding: 0.8rem 1.5rem;
                margin: 0.5rem;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar" id="navbar">
        <a href="#" class="logo">
            <div class="logo-icon">✦</div>
            <span class="logo-text">ASWAH</span>
        </a>
        <div class="cart-icon" onclick="toggleCart()">
            <span style="font-size: 1.5rem;">🛒</span>
            <span class="cart-count" id="cartCount">0</span>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-badge">🔥 تخفيضات الموسم</div>
        <h1>منتجات رقمية<br>تُلهم إبداعك</h1>
        <p>اكتشف مجموعة مختارة من أفضل المنتجات الرقمية المصممة بعناية فائقة لتعزيز إنتاجيتك وإبداعك</p>
        <a href="#products" class="cta-btn">استكشف المنتجات ←</a>
    </section>

    <div class="container" id="products">
        <h2 class="section-title">منتجاتنا المميزة</h2>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- Cart Modal -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <div class="cart-header">
                <h2>🛒 سلة التسوق</h2>
                <button class="cart-close" onclick="toggleCart()">✕</button>
            </div>
            <div id="cartItems"></div>
            <div class="cart-total" id="cartTotal">الإجمالي: 0.00 $</div>
            <button class="checkout-btn" onclick="checkout()">✨ إتمام الشراء</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // Products data
        const products = [
            {
                id: 1,
                name: "قالب بورتفوليو احترافي",
                category: "قوالب",
                price: 29.99,
                rating: 5,
                emoji: "🎨",
                badge: "الأكثر مبيعاً"
            },
            {
                id: 2,
                name: "حزمة أيقونات فريدة",
                category: "تصميم",
                price: 19.99,
                rating: 4,
                emoji: "💎"
            },
            {
                id: 3,
                name: "دورة تطوير الويب الشاملة",
                category: "تعليم",
                price: 49.99,
                rating: 5,
                emoji: "🚀",
                badge: "جديد"
            },
            {
                id: 4,
                name: "مجموعة خطوط عربية",
                category: "تصميم",
                price: 14.99,
                rating: 4,
                emoji: "✍️"
            },
            {
                id: 5,
                name: "نظام إدارة محتوى متكامل",
                category: "برمجيات",
                price: 79.99,
                rating: 5,
                emoji: "⚡",
                badge: "خصم 30%"
            },
            {
                id: 6,
                name: "باقة صور ستوك عالية الجودة",
                category: "وسائط",
                price: 24.99,
                rating: 4,
                emoji: "📸"
            }
        ];

        let cart = [];

        // Render products
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = products.map(product => `
                <div class="product-card">
                    ${product.badge ? `<span class="product-badge">${product.badge}</span>` : ''}
                    <div class="product-image">${product.emoji}</div>
                    <div class="product-category">${product.category}</div>
                    <div class="product-name">${product.name}</div>
                    <div class="product-rating">
                        ${'★'.repeat(product.rating)}${'☆'.repeat(5 - product.rating)}
                        <span style="color: #636e72; margin-right: 0.5rem;">(${product.rating}.0)</span>
                    </div>
                    <div class="product-footer">
                        <div class="product-price">${product.price} <span>$</span></div>
                        <button class="add-to-cart-btn" onclick="addToCart(${product.id})">
                            <span>أضف للسلة</span>
                            <span class="cart-icon-small">+</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Add to cart
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCart();
            showToast(`✅ تمت إضافة "${product.name}" إلى السلة`);
        }

        // Remove from cart
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCart();
        }

        // Update cart UI
        function updateCart() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;

            const cartItems = document.getElementById('cartItems');
            const cartTotal = document.getElementById('cartTotal');

            if (cart.length === 0) {
                cartItems.innerHTML = '<p style="text-align: center; color: #636e72; padding: 2rem;">🛒 السلة فارغة</p>';
            } else {
                cartItems.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <div>
                            <strong>${item.emoji} ${item.name}</strong>
                            <div style="color: #636e72; font-size: 0.9rem;">
                                ${item.quantity} × ${item.price} $
                            </div>
                        </div>
                        <button class="remove-btn" onclick="removeFromCart(${item.id})">✕ حذف</button>
                    </div>
                `).join('');
            }

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            cartTotal.textContent = `الإجمالي: ${total.toFixed(2)} $`;
        }

        // Toggle cart modal
        function toggleCart() {
            const modal = document.getElementById('cartModal');
            modal.classList.toggle('active');
            if (modal.classList.contains('active')) {
                updateCart();
            }
        }

        // Close modal on outside click
        document.getElementById('cartModal').addEventListener('click', function(e) {
            if (e.target === this) {
                toggleCart();
            }
        });

        // Checkout
        function checkout() {
            if (cart.length === 0) {
                showToast('⚠️ السلة فارغة! أضف بعض المنتجات أولاً');
                return;
            }
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            showToast(`🎉 شكراً لك! تمت عملية الشراء بقيمة ${total.toFixed(2)} $ بنجاح`);
            cart = [];
            updateCart();
            setTimeout(() => toggleCart(), 1000);
        }

        // Toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Navbar scroll effect
        window.addEventListener('scroll', () => {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // Smooth scroll
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
        });

        // Initial render
        renderProducts();
    </script>

</body>
</html>
